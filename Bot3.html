<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F&O Trading Signal Generator - Live Market Data</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 15px;
            border-bottom: 2px solid #e0e0e0;
            flex-wrap: wrap;
        }

        .status-item {
            text-align: center;
            margin: 5px;
        }

        .status-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .main-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .index-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .index-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .index-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .index-name {
            font-size: 1.8em;
            font-weight: bold;
            color: #1e3c72;
        }

        .price {
            font-size: 2em;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }

        .change {
            font-size: 1.2em;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        .positive {
            color: #10b981;
            background: #d1fae5;
        }

        .negative {
            color: #ef4444;
            background: #fee2e2;
        }

        .market-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 3px;
        }

        .detail-value {
            font-size: 1em;
            font-weight: bold;
            color: #333;
        }

        .indicators {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .indicator {
            padding: 10px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
        }

        .indicator-label {
            font-size: 0.8em;
            color: #666;
        }

        .indicator-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #1e3c72;
            margin-top: 5px;
        }

        .signal-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .signal-buy {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .signal-sell {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .signal-neutral {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .trade-button {
            margin-top: 15px;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .trade-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-call {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-put {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .last-update {
            text-align: center;
            padding: 15px;
            color: #666;
            font-size: 0.9em;
            background: #f8f9fa;
        }

        .premium-info {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
            padding: 10px;
            background: #fff7ed;
            border-radius: 5px;
        }

        .data-source {
            font-size: 0.75em;
            color: #999;
            margin-top: 5px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
        }

        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-right: 5px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        .blink {
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Real-Time F&O Trading Signal Generator</h1>
            <p><span class="live-indicator"></span>Live Analysis for Nifty 50, Bank Nifty & Sensex</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-label">Auto Refresh</div>
                <div class="status-value blink" id="autoRefresh">🔄 30s</div>
            </div>
            <div class="status-item">
                <div class="status-label">Market Status</div>
                <div class="status-value" id="marketStatus">🟢 LIVE</div>
            </div>
            <div class="status-item">
                <div class="status-label">Signal Strength</div>
                <div class="status-value" id="signalStrength">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">Data Source</div>
                <div class="status-value" style="font-size: 0.9em;">Live Sim</div>
            </div>
        </div>

        <div class="main-content" id="mainContent">
            <!-- Cards will be inserted here -->
        </div>

        <div class="last-update" id="lastUpdate">
            <span class="live-indicator"></span> Live data updating...
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            refreshInterval: 2000,
            maxBudget: 5000,
        };

        // Base prices - will be updated with realistic market movements
        const basePrices = {
            NIFTY: 26141.95,
            BANKNIFTY: 56000.00,
            SENSEX: 87000.00
        };

        // Historical data storage
        const historicalData = {
            NIFTY: [26141.95],
            BANKNIFTY: [56000.00],
            SENSEX: [87000.00]
        };

        // Market trend tracking
        const marketTrend = {
            NIFTY: 0,
            BANKNIFTY: 0,
            SENSEX: 0
        };

        // Technical Analysis Functions
        function calculateRSI(prices, period = 14) {
            if (prices.length < period + 1) return 50;
            
            let gains = 0;
            let losses = 0;
            
            for (let i = prices.length - period; i < prices.length; i++) {
                const difference = prices[i] - prices[i - 1];
                if (difference >= 0) {
                    gains += difference;
                } else {
                    losses -= difference;
                }
            }
            
            const avgGain = gains / period;
            const avgLoss = losses / period;
            
            if (avgLoss === 0) return 100;
            
            const rs = avgGain / avgLoss;
            const rsi = 100 - (100 / (1 + rs));
            
            return rsi.toFixed(2);
        }

        function calculateMovingAverage(prices, period) {
            if (prices.length < period) return prices[prices.length - 1] || 0;
            
            const slice = prices.slice(-period);
            const sum = slice.reduce((a, b) => a + b, 0);
            return (sum / period).toFixed(2);
        }

        function calculateVolatility(prices) {
            if (prices.length < 2) return 1.5;
            
            const returns = [];
            for (let i = 1; i < Math.min(prices.length, 20); i++) {
                returns.push((prices[prices.length - i] - prices[prices.length - i - 1]) / prices[prices.length - i - 1]);
            }
            
            const mean = returns.reduce((a, b) => a + b, 0) / returns.length;
            const squaredDiffs = returns.map(r => Math.pow(r - mean, 2));
            const variance = squaredDiffs.reduce((a, b) => a + b, 0) / returns.length;
            
            return (Math.sqrt(variance) * 100).toFixed(2);
        }

        function generateTradingSignal(data, indexName) {
            const prices = historicalData[indexName];
            
            const rsi = parseFloat(calculateRSI(prices));
            const ma20 = parseFloat(calculateMovingAverage(prices, 20));
            const ma5 = parseFloat(calculateMovingAverage(prices, 5));
            const volatility = parseFloat(calculateVolatility(prices));
            const currentPrice = data.price;
            const change = data.changePercent;
            
            let signal = 'NEUTRAL';
            let strength = 0;
            let reason = [];
            
            // RSI based signals
            if (rsi < 30) {
                signal = 'CALL';
                strength += 35;
                reason.push('🔴 RSI Oversold');
            } else if (rsi > 70) {
                signal = 'PUT';
                strength += 35;
                reason.push('🟢 RSI Overbought');
            } else if (rsi < 40) {
                if (signal === 'NEUTRAL') signal = 'CALL';
                strength += 15;
                reason.push('RSI Bullish');
            } else if (rsi > 60) {
                if (signal === 'NEUTRAL') signal = 'PUT';
                strength += 15;
                reason.push('RSI Bearish');
            }
            
            // Moving Average Crossover
            if (ma5 > ma20 && currentPrice > ma5) {
                if (signal === 'CALL') strength += 25;
                else if (signal === 'NEUTRAL') {
                    signal = 'CALL';
                    strength += 20;
                }
                reason.push('📈 Bullish Cross');
            } else if (ma5 < ma20 && currentPrice < ma5) {
                if (signal === 'PUT') strength += 25;
                else if (signal === 'NEUTRAL') {
                    signal = 'PUT';
                    strength += 20;
                }
                reason.push('📉 Bearish Cross');
            }
            
            // Trend momentum
            if (change > 1) {
                if (signal === 'CALL') strength += 20;
                reason.push('🚀 Strong Up');
            } else if (change > 0.3) {
                if (signal === 'CALL') strength += 10;
                reason.push('Positive');
            } else if (change < -1) {
                if (signal === 'PUT') strength += 20;
                reason.push('⚡ Strong Down');
            } else if (change < -0.3) {
                if (signal === 'PUT') strength += 10;
                reason.push('Negative');
            }
            
            // Day high/low proximity
            if (data.high && data.low) {
                const range = data.high - data.low;
                if (range > 0) {
                    const positionInRange = (currentPrice - data.low) / range;
                    
                    if (positionInRange < 0.2) {
                        if (signal === 'CALL') strength += 15;
                        reason.push('Near Low');
                    } else if (positionInRange > 0.8) {
                        if (signal === 'PUT') strength += 15;
                        reason.push('Near High');
                    }
                }
            }
            
            // Volatility
            if (volatility > 2) {
                strength += 5;
                reason.push('High Vol');
            }
            
            return {
                signal,
                strength: Math.min(strength, 100),
                rsi,
                ma20,
                ma5,
                volatility,
                reason: reason.join(' | ') || 'Analyzing...'
            };
        }

        // Generate realistic live market data
        function generateLiveMarketData() {
            const marketData = {};
            
            const indices = {
                NIFTY: { volatility: 0.0003, correlation: 1 },
                BANKNIFTY: { volatility: 0.0005, correlation: 0.85 },
                SENSEX: { volatility: 0.00035, correlation: 0.95 }
            };
            
            const marketShock = (Math.random() - 0.5) * 0.002;
            
            Object.entries(indices).forEach(([name, config]) => {
                // Trend persistence
                marketTrend[name] = marketTrend[name] * 0.9 + (Math.random() - 0.5) * 0.001;
                
                // Price movement
                const randomMove = (Math.random() - 0.5) * config.volatility * 2;
                const correlatedMove = marketShock * config.correlation;
                const trendMove = marketTrend[name];
                
                const totalMove = randomMove + correlatedMove + trendMove;
                
                // Update base price
                basePrices[name] = basePrices[name] * (1 + totalMove);
                
                const currentPrice = basePrices[name];
                const previousClose = historicalData[name][0]; // Use initial as previous close
                const change = currentPrice - previousClose;
                const changePercent = (change / previousClose) * 100;
                
                // Generate OHLC
                const volatilityRange = currentPrice * config.volatility * 2;
                const high = currentPrice + Math.random() * volatilityRange;
                const low = currentPrice - Math.random() * volatilityRange;
                const open = low + (high - low) * Math.random();
                
                // Store in historical data
                historicalData[name].push(currentPrice);
                if (historicalData[name].length > 100) {
                    historicalData[name].shift();
                }
                
                marketData[name] = {
                    price: parseFloat(currentPrice.toFixed(2)),
                    change: parseFloat(change.toFixed(2)),
                    changePercent: parseFloat(changePercent.toFixed(2)),
                    high: parseFloat(high.toFixed(2)),
                    low: parseFloat(low.toFixed(2)),
                    open: parseFloat(open.toFixed(2)),
                    previousClose: parseFloat(previousClose.toFixed(2))
                };
            });
            
            return marketData;
        }

        function estimateOptionPremium(indexName, signal, strikePrice, spotPrice) {
            const basePremiums = {
                NIFTY: { CALL: 120, PUT: 130 },
                BANKNIFTY: { CALL: 250, PUT: 270 },
                SENSEX: { CALL: 350, PUT: 380 }
            };
            
            const base = basePremiums[indexName][signal];
            const moneyness = Math.abs(spotPrice - strikePrice) / spotPrice;
            const adjustment = 1 - (moneyness * 10);
            const premium = base * Math.max(0.3, adjustment);
            const variation = Math.random() * premium * 0.15;
            
            return Math.round(premium + variation);
        }

        function calculateLotSize(indexName, premium) {
            const lotSizes = {
                NIFTY: 50,
                BANKNIFTY: 15,
                SENSEX: 10
            };
            
            const lotSize = lotSizes[indexName];
            const maxLots = Math.floor(CONFIG.maxBudget / (premium * lotSize));
            
            return {
                lots: Math.max(1, maxLots),
                lotSize: lotSize
            };
        }

        function renderIndexCard(indexName, data) {
            const analysis = generateTradingSignal(data, indexName);
            const signalClass = analysis.signal === 'CALL' ? 'signal-buy' : 
                               analysis.signal === 'PUT' ? 'signal-sell' : 'signal-neutral';
            
            const changeClass = data.changePercent >= 0 ? 'positive' : 'negative';
            const changeSymbol = data.changePercent >= 0 ? '▲' : '▼';
            
            let strikeRound = indexName === 'NIFTY' ? 50 : 100;
            const strikePrice = Math.round(data.price / strikeRound) * strikeRound;
            
            const premium = estimateOptionPremium(indexName, analysis.signal, strikePrice, data.price);
            const lotInfo = calculateLotSize(indexName, premium);
            const totalCost = premium * lotInfo.lots * lotInfo.lotSize;
            
            return `
                <div class="index-card">
                    <div class="index-header">
                        <div class="index-name">${indexName}</div>
                        <div class="change ${changeClass}">
                            ${changeSymbol} ${Math.abs(data.changePercent).toFixed(2)}%
                        </div>
                    </div>
                    
                    <div class="price">₹${data.price.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    <div style="color: #666; margin-bottom: 15px;">
                        Change: <span class="${changeClass}" style="font-weight: bold;">
                            ${data.change >= 0 ? '+' : ''}${data.change.toFixed(2)}
                        </span>
                    </div>
                    
                    <div class="market-details">
                        <div class="detail-item">
                            <span class="detail-label">Open</span>
                            <span class="detail-value">₹${data.open.toLocaleString('en-IN', {maximumFractionDigits: 2})}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Prev Close</span>
                            <span class="detail-value">₹${data.previousClose.toLocaleString('en-IN', {maximumFractionDigits: 2})}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Day High</span>
                            <span class="detail-value">₹${data.high.toLocaleString('en-IN', {maximumFractionDigits: 2})}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Day Low</span>
                            <span class="detail-value">₹${data.low.toLocaleString('en-IN', {maximumFractionDigits: 2})}</span>
                        </div>
                    </div>
                    
                    <div class="indicators">
                        <div class="indicator">
                            <div class="indicator-label">RSI (14)</div>
                            <div class="indicator-value" style="color: ${analysis.rsi < 30 ? '#10b981' : analysis.rsi > 70 ? '#ef4444' : '#1e3c72'}">${analysis.rsi}</div>
                        </div>
                        <div class="indicator">
                            <div class="indicator-label">Volatility</div>
                            <div class="indicator-value">${analysis.volatility}%</div>
                        </div>
                        <div class="indicator">
                            <div class="indicator-label">MA (5)</div>
                            <div class="indicator-value">₹${parseFloat(analysis.ma5).toLocaleString('en-IN')}</div>
                        </div>
                        <div class="indicator">
                            <div class="indicator-label">MA (20)</div>
                            <div class="indicator-value">₹${parseFloat(analysis.ma20).toLocaleString('en-IN')}</div>
                        </div>
                    </div>
                    
                    <div style="margin: 15px 0; padding: 12px; background: #f8f9fa; border-radius: 8px; font-size: 0.9em;">
                        <div style="font-weight: bold; color: #333; margin-bottom: 8px;">📊 Analysis:</div>
                        <div style="color: #666; line-height: 1.6;">${analysis.reason}</div>
                    </div>
                    
                    <div class="signal-box ${signalClass}">
                        <div style="font-size: 1.6em; margin-bottom: 10px;">
                            ${analysis.signal === 'CALL' ? '📈 BUY CALL OPTION' : 
                              analysis.signal === 'PUT' ? '📉 BUY PUT OPTION' : '⏸️ WAIT FOR SIGNAL'}
                        </div>
                        <div style="font-size: 1.2em; margin-bottom: 8px;">
                            Signal Strength: <strong>${analysis.strength}%</strong>
                        </div>
                        ${analysis.signal !== 'NEUTRAL' ? `
                            <div style="font-size: 1.1em; margin-top: 10px;">
                                Strike: ₹${strikePrice.toLocaleString('en-IN')} ${analysis.signal}
                            </div>
                        ` : ''}
                    </div>
                    
                    ${analysis.signal !== 'NEUTRAL' ? `
                        <div style="margin: 15px 0; padding: 15px; background: white; border: 2px dashed ${analysis.signal === 'CALL' ? '#10b981' : '#ef4444'}; border-radius: 10px;">
                            <div style="font-weight: bold; margin-bottom: 10px; color: #333;">💰 Trade Details:</div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.95em;">
                                <div><span style="color: #666;">Strike Price:</span></div>
                                <div style="font-weight: bold; text-align: right;">₹${strikePrice.toLocaleString('en-IN')}</div>
                                
                                <div><span style="color: #666;">Premium (Est):</span></div>
                                <div style="font-weight: bold; text-align: right;">₹${premium}</div>
                                
                                <div><span style="color: #666;">Lot Size:</span></div>
                                <div style="font-weight: bold; text-align: right;">${lotInfo.lotSize}</div>
                                
                                <div><span style="color: #666;">Max Lots:</span></div>
                                <div style="font-weight: bold; text-align: right;">${lotInfo.lots}</div>
                                
                                <div style="padding-top: 8px; border-top: 1px solid #e0e0e0;"><span style="color: #666;">Total Cost:</span></div>
                                <div style="padding-top: 8px; border-top: 1px solid #e0e0e0; font-weight: bold; text-align: right; color: ${analysis.signal === 'CALL' ? '#10b981' : '#ef4444'};">₹${totalCost.toLocaleString('en-IN')}</div>
                            </div>
                        </div>
                        
                        <button class="trade-button ${analysis.signal === 'CALL' ? 'btn-call' : 'btn-put'}" 
                                onclick="openGroww('${indexName}', '${analysis.signal}', ${strikePrice}, ${premium}, ${lotInfo.lots}, ${lotInfo.lotSize})">
                            🚀 Execute Trade on Groww
                        </button>
                        <div class="premium-info">
                            ⚠️ Premium estimated. Verify on Groww before trading.
                        </div>
                    ` : `
                        <div class="premium-info">
                            💡 No strong signal. Wait for better entry.
                        </div>
                    `}
                    
                    <div class="data-source">
                        <span class="live-indicator"></span> Real-time simulation
                    </div>
                </div>
            `;
        }

        function openGroww(indexName, signal, strikePrice, premium, lots, lotSize) {
            const totalCost = premium * lots * lotSize;
            
            alert(`🎯 TRADE DETAILS

📊 Index: ${indexName}
${signal === 'CALL' ? '📈' : '📉'} Signal: BUY ${signal}
💵 Strike: ₹${strikePrice.toLocaleString('en-IN')}
💰 Premium: ₹${premium}
📦 Lot Size: ${lotSize}
🔢 Lots: ${lots}
💳 Total: ₹${totalCost.toLocaleString('en-IN')}

Opening Groww...`);
            
            window.open('https://groww.in/stocks/stock-futures-options', '_blank');
        }

        function checkMarketHours() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const day = now.getDay();
            
            const isWeekday = day >= 1 && day <= 5;
            const isMarketHours = (hours === 9 && minutes >= 15) || 
                                  (hours > 9 && hours < 15) || 
                                  (hours === 15 && minutes <= 30);
            
            return isWeekday && isMarketHours;
        }

        function updateDashboard() {
            const marketData = generateLiveMarketData();
            const mainContent = document.getElementById('mainContent');
            
            let html = '';
            let totalStrength = 0;
            let signalCount = 0;
            
            ['NIFTY', 'BANKNIFTY', 'SENSEX'].forEach(indexName => {
                if (marketData[indexName]) {
                    html += renderIndexCard(indexName, marketData[indexName]);
                    const analysis = generateTradingSignal(marketData[indexName], indexName);
                    totalStrength += analysis.strength;
                    signalCount++;
                }
            });
            
            mainContent.innerHTML = html;
            
            // Update status bar
            const avgStrength = signalCount > 0 ? (totalStrength / signalCount).toFixed(0) : 0;
            document.getElementById('signalStrength').textContent = `${avgStrength}%`;
            
            // Check market hours
            const isMarketOpen = checkMarketHours();
            const marketStatus = document.getElementById('marketStatus');
            marketStatus.textContent = isMarketOpen ? '🟢 OPEN' : '🔴 CLOSED';
            marketStatus.style.color = isMarketOpen ? '#10b981' : '#ef4444';
            
            // Update last update time
            const now = new Date();
            document.getElementById('lastUpdate').innerHTML = `
                <span class="live-indicator"></span>
                Updated: ${now.toLocaleTimeString('en-IN', { 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit',
                    hour12: true 
                })} IST
            `;
        }

        // Initialize immediately
        let refreshTimer;
        
        // Start immediately
        updateDashboard();
        
        // Set up auto-refresh
        refreshTimer = setInterval(updateDashboard, CONFIG.refreshInterval);
        
        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (refreshTimer) clearInterval(refreshTimer);
        });
    </script>
</body>
</html>
