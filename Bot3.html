<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F&O Trading Signal Generator - Real Live Market Data</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 15px;
            border-bottom: 2px solid #e0e0e0;
            flex-wrap: wrap;
        }

        .status-item {
            text-align: center;
            margin: 5px;
        }

        .status-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .main-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .index-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .index-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .index-card.market-closed {
            opacity: 0.7;
            filter: grayscale(30%);
        }

        .index-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .index-name {
            font-size: 1.8em;
            font-weight: bold;
            color: #1e3c72;
        }

        .price {
            font-size: 2em;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }

        .change {
            font-size: 1.2em;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        .positive {
            color: #10b981;
            background: #d1fae5;
        }

        .negative {
            color: #ef4444;
            background: #fee2e2;
        }

        .market-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 3px;
        }

        .detail-value {
            font-size: 1em;
            font-weight: bold;
            color: #333;
        }

        .indicators {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .indicator {
            padding: 10px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
        }

        .indicator-label {
            font-size: 0.8em;
            color: #666;
        }

        .indicator-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #1e3c72;
            margin-top: 5px;
        }

        .signal-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .signal-buy {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .signal-sell {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .signal-neutral {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .trade-button {
            margin-top: 15px;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .trade-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .trade-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-call {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-put {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .last-update {
            text-align: center;
            padding: 15px;
            color: #666;
            font-size: 0.9em;
            background: #f8f9fa;
        }

        .premium-info {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
            padding: 10px;
            background: #fff7ed;
            border-radius: 5px;
        }

        .data-source {
            font-size: 0.75em;
            color: #999;
            margin-top: 5px;
            font-style: italic;
        }

        .market-closed-banner {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }

        .market-closed-banner h2 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .market-timings {
            background: #f8f9fa;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            border-left: 4px solid #1e3c72;
        }

        .market-timings h3 {
            color: #1e3c72;
            margin-bottom: 15px;
        }

        .timing-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .timing-row:last-child {
            border-bottom: none;
        }

        .countdown {
            font-size: 1.2em;
            font-weight: bold;
            color: #1e3c72;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #666;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1e3c72;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
        }

        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-right: 5px;
        }

        .paused-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            margin-right: 5px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        .blink {
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .api-status {
            padding: 10px;
            margin: 10px 20px;
            border-radius: 5px;
            font-size: 0.9em;
            text-align: center;
        }

        .api-success {
            background: #d1fae5;
            color: #059669;
        }

        .api-error {
            background: #fee2e2;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Real-Time F&O Trading Signal Generator</h1>
            <p id="headerStatus">
                <span class="live-indicator"></span>Fetching Live Market Data...
            </p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-label">Auto Refresh</div>
                <div class="status-value" id="autoRefresh">🔄 30s</div>
            </div>
            <div class="status-item">
                <div class="status-label">Market Status</div>
                <div class="status-value" id="marketStatus">Checking...</div>
            </div>
            <div class="status-item">
                <div class="status-label">Signal Strength</div>
                <div class="status-value" id="signalStrength">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">IST Time</div>
                <div class="status-value" id="currentTime">--:--</div>
            </div>
        </div>

        <div id="apiStatus"></div>
        <div id="marketClosedNotice"></div>

        <div class="main-content" id="mainContent">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Connecting to live market data feeds...</p>
                <p style="font-size: 0.9em; margin-top: 10px; color: #999;">Fetching real-time prices from NSE/BSE</p>
            </div>
        </div>

        <div class="last-update" id="lastUpdate">
            <span class="live-indicator"></span> Connecting...
        </div>
    </div>

    <script>
        const CONFIG = {
            refreshInterval: 30000,
            maxBudget: 5000,
            apiTimeout: 10000
        };

        const MARKET_CONFIG = {
            openHour: 9,
            openMinute: 15,
            closeHour: 15,
            closeMinute: 30
        };

        const historicalData = {
            NIFTY: [],
            BANKNIFTY: [],
            SENSEX: []
        };

        let isMarketOpen = false;
        let refreshTimer = null;
        let lastFetchSuccess = false;

        // Get IST time
        function getISTTime() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const istOffset = 5.5 * 60 * 60 * 1000;
            return new Date(utc + istOffset);
        }

        // Check market hours
        function checkMarketHours() {
            const istTime = getISTTime();
            const hours = istTime.getHours();
            const minutes = istTime.getMinutes();
            const day = istTime.getDay();
            
            if (day === 0 || day === 6) {
                return { isOpen: false, reason: 'Weekend', nextOpen: getNextMarketOpen(istTime) };
            }
            
            const currentMinutes = hours * 60 + minutes;
            const marketOpenMinutes = MARKET_CONFIG.openHour * 60 + MARKET_CONFIG.openMinute;
            const marketCloseMinutes = MARKET_CONFIG.closeHour * 60 + MARKET_CONFIG.closeMinute;
            
            if (currentMinutes >= marketOpenMinutes && currentMinutes <= marketCloseMinutes) {
                return { isOpen: true, reason: 'Market Open', nextOpen: null };
            } else if (currentMinutes < marketOpenMinutes) {
                return { isOpen: false, reason: 'Pre-Market', nextOpen: getNextMarketOpen(istTime) };
            } else {
                return { isOpen: false, reason: 'Market Closed', nextOpen: getNextMarketOpen(istTime) };
            }
        }

        function getNextMarketOpen(currentTime) {
            const nextOpen = new Date(currentTime);
            const day = nextOpen.getDay();
            
            if (day === 6) {
                nextOpen.setDate(nextOpen.getDate() + 2);
            } else if (day === 0) {
                nextOpen.setDate(nextOpen.getDate() + 1);
            } else if (nextOpen.getHours() >= MARKET_CONFIG.closeHour) {
                nextOpen.setDate(nextOpen.getDate() + 1);
            }
            
            nextOpen.setHours(MARKET_CONFIG.openHour, MARKET_CONFIG.openMinute, 0, 0);
            return nextOpen;
        }

        function formatTimeRemaining(targetTime) {
            const now = getISTTime();
            const diff = targetTime - now;
            
            if (diff <= 0) return 'Opening soon...';
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            if (hours > 24) {
                const days = Math.floor(hours / 24);
                return `${days} day${days > 1 ? 's' : ''} ${hours % 24}h`;
            }
            
            return `${hours}h ${minutes}m ${seconds}s`;
        }

        // Fetch REAL live data from multiple sources
        async function fetchRealMarketData() {
            const methods = [
                fetchFromNSEIndia,
                fetchFromYahooFinance,
                fetchFromGoogleFinance,
                fetchFromRapidAPI
            ];

            for (const method of methods) {
                try {
                    console.log(`Trying ${method.name}...`);
                    const data = await method();
                    if (data && Object.keys(data).length > 0) {
                        console.log(`✅ Success with ${method.name}`);
                        lastFetchSuccess = true;
                        updateAPIStatus(true, method.name);
                        return data;
                    }
                } catch (error) {
                    console.error(`❌ ${method.name} failed:`, error.message);
                }
            }

            lastFetchSuccess = false;
            updateAPIStatus(false, 'All APIs');
            return null;
        }

        // Method 1: NSE India Official
        async function fetchFromNSEIndia() {
            const response = await fetch('https://www.nseindia.com/api/allIndices', {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'User-Agent': 'Mozilla/5.0'
                }
            });

            if (!response.ok) throw new Error('NSE API failed');
            
            const json = await response.json();
            const marketData = {};

            json.data.forEach(index => {
                if (index.index === 'NIFTY 50') {
                    marketData.NIFTY = parseNSEData(index);
                } else if (index.index === 'NIFTY BANK') {
                    marketData.BANKNIFTY = parseNSEData(index);
                }
            });

            // Fetch Sensex from BSE
            marketData.SENSEX = await fetchSensexFromBSE();
            
            return marketData;
        }

        // Method 2: Yahoo Finance (Most Reliable)
        async function fetchFromYahooFinance() {
            const symbols = {
                'NIFTY': '^NSEI',
                'BANKNIFTY': '^NSEBANK',
                'SENSEX': '^BSESN'
            };

            const marketData = {};

            for (const [key, symbol] of Object.entries(symbols)) {
                try {
                    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=1d`;
                    const response = await fetch(url);
                    const data = await response.json();

                    const quote = data.chart.result[0];
                    const meta = quote.meta;
                    const indicators = quote.indicators.quote[0];
                    const timestamps = quote.timestamp;
                    
                    const current = meta.regularMarketPrice;
                    const previous = meta.previousClose;
                    const open = indicators.open[0];
                    const high = Math.max(...indicators.high.filter(h => h !== null));
                    const low = Math.min(...indicators.low.filter(l => l !== null));

                    marketData[key] = {
                        price: parseFloat(current.toFixed(2)),
                        change: parseFloat((current - previous).toFixed(2)),
                        changePercent: parseFloat((((current - previous) / previous) * 100).toFixed(2)),
                        high: parseFloat(high.toFixed(2)),
                        low: parseFloat(low.toFixed(2)),
                        open: parseFloat(open.toFixed(2)),
                        previousClose: parseFloat(previous.toFixed(2)),
                        timestamp: new Date(timestamps[timestamps.length - 1] * 1000)
                    };
                } catch (e) {
                    console.error(`Failed to fetch ${key}:`, e);
                }
            }

            if (Object.keys(marketData).length === 0) throw new Error('No data fetched');
            return marketData;
        }

        // Method 3: Google Finance
        async function fetchFromGoogleFinance() {
            const symbols = {
                'NIFTY': 'NIFTY_50',
                'BANKNIFTY': 'NIFTY_BANK',
                'SENSEX': 'SENSEX'
            };

            // Google Finance doesn't have a direct API, would need scraping
            throw new Error('Google Finance method not implemented');
        }

        // Method 4: RapidAPI (Backup)
        async function fetchFromRapidAPI() {
            // This would require an API key
            // Free tier available at rapidapi.com
            throw new Error('RapidAPI requires API key');
        }

        async function fetchSensexFromBSE() {
            try {
                // BSE API endpoint
                const response = await fetch('https://api.bseindia.com/BseIndiaAPI/api/DefaultData/w');
                const data = await response.json();
                
                const sensex = data.Table.find(item => item.IndxNm === 'Sensex');
                if (sensex) {
                    return {
                        price: parseFloat(sensex.CurrRate),
                        change: parseFloat(sensex.Change),
                        changePercent: parseFloat(sensex.PerChange),
                        high: parseFloat(sensex.High),
                        low: parseFloat(sensex.Low),
                        open: parseFloat(sensex.Open),
                        previousClose: parseFloat(sensex.PrevClose)
                    };
                }
            } catch (e) {
                console.error('BSE fetch failed:', e);
            }
            return null;
        }

        function parseNSEData(index) {
            return {
                price: parseFloat(index.last),
                change: parseFloat(index.change),
                changePercent: parseFloat(index.pChange),
                high: parseFloat(index.high || index.last),
                low: parseFloat(index.low || index.last),
                open: parseFloat(index.open || index.last),
                previousClose: parseFloat(index.previousClose || index.last)
            };
        }

        function updateAPIStatus(success, source) {
            const statusDiv = document.getElementById('apiStatus');
            if (success) {
                statusDiv.innerHTML = `<div class="api-status api-success">✅ Connected to ${source} - Real-time data active</div>`;
            } else {
                statusDiv.innerHTML = `<div class="api-status api-error">⚠️ Unable to fetch live data from ${source}. Retrying...</div>`;
            }
        }

        function displayMarketClosedNotice(marketInfo) {
            const notice = document.getElementById('marketClosedNotice');
            
            if (!marketInfo.isOpen) {
                const timeRemaining = marketInfo.nextOpen ? formatTimeRemaining(marketInfo.nextOpen) : '';
                
                notice.innerHTML = `
                    <div class="market-closed-banner">
                        <h2>🔴 Market is Currently ${marketInfo.reason}</h2>
                        <p style="font-size: 1.1em; margin-top: 10px;">
                            Trading hours: Monday-Friday, 9:15 AM - 3:30 PM IST
                        </p>
                        ${marketInfo.nextOpen ? `
                            <div class="countdown">
                                Market opens in: <span id="countdownTimer">${timeRemaining}</span>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="market-timings">
                        <h3>📅 Indian Stock Market Timings (IST)</h3>
                        <div class="timing-row">
                            <span style="color: #666;">Pre-Market:</span>
                            <span style="font-weight: bold;">9:00 AM - 9:15 AM</span>
                        </div>
                        <div class="timing-row">
                            <span style="color: #666;">Regular Session:</span>
                            <span style="font-weight: bold; color: #10b981;">9:15 AM - 3:30 PM</span>
                        </div>
                        <div class="timing-row">
                            <span style="color: #666;">Post-Market:</span>
                            <span style="font-weight: bold;">3:30 PM - 4:00 PM</span>
                        </div>
                        <div class="timing-row">
                            <span style="color: #666;">Trading Days:</span>
                            <span style="font-weight: bold;">Monday - Friday (except holidays)</span>
                        </div>
                    </div>
                `;
                
                if (marketInfo.nextOpen) {
                    setInterval(() => {
                        const timer = document.getElementById('countdownTimer');
                        if (timer) {
                            timer.textContent = formatTimeRemaining(marketInfo.nextOpen);
                        }
                    }, 1000);
                }
            } else {
                notice.innerHTML = '';
            }
        }

        // Technical Analysis Functions
        function calculateRSI(prices, period = 14) {
            if (prices.length < period + 1) return 50;
            
            let gains = 0;
            let losses = 0;
            
            for (let i = prices.length - period; i < prices.length; i++) {
                const difference = prices[i] - prices[i - 1];
                if (difference >= 0) gains += difference;
                else losses -= difference;
            }
            
            const avgGain = gains / period;
            const avgLoss = losses / period;
            if (avgLoss === 0) return 100;
            
            const rs = avgGain / avgLoss;
            return (100 - (100 / (1 + rs))).toFixed(2);
        }

        function calculateMovingAverage(prices, period) {
            if (prices.length < period) return prices[prices.length - 1] || 0;
            const slice = prices.slice(-period);
            return (slice.reduce((a, b) => a + b, 0) / period).toFixed(2);
        }

        function calculateVolatility(prices) {
            if (prices.length < 2) return 1.5;
            
            const returns = [];
            for (let i = 1; i < Math.min(prices.length, 20); i++) {
                returns.push((prices[prices.length - i] - prices[prices.length - i - 1]) / prices[prices.length - i - 1]);
            }
            
            const mean = returns.reduce((a, b) => a + b, 0) / returns.length;
            const variance = returns.map(r => Math.pow(r - mean, 2)).reduce((a, b) => a + b, 0) / returns.length;
            
            return (Math.sqrt(variance) * 100).toFixed(2);
        }

        function generateTradingSignal(data, indexName) {
            const prices = historicalData[indexName];
            
            const rsi = parseFloat(calculateRSI(prices));
            const ma20 = parseFloat(calculateMovingAverage(prices, 20));
            const ma5 = parseFloat(calculateMovingAverage(prices, 5));
            const volatility = parseFloat(calculateVolatility(prices));
            const currentPrice = data.price;
            const change = data.changePercent;
            
            let signal = 'NEUTRAL';
            let strength = 0;
            let reason = [];
            
            if (rsi < 30) {
                signal = 'CALL';
                strength += 35;
                reason.push('🔴 RSI Oversold');
            } else if (rsi > 70) {
                signal = 'PUT';
                strength += 35;
                reason.push('🟢 RSI Overbought');
            } else if (rsi < 40) {
                if (signal === 'NEUTRAL') signal = 'CALL';
                strength += 15;
                reason.push('RSI Bullish');
            } else if (rsi > 60) {
                if (signal === 'NEUTRAL') signal = 'PUT';
                strength += 15;
                reason.push('RSI Bearish');
            }
            
            if (ma5 > ma20 && currentPrice > ma5) {
                if (signal === 'CALL') strength += 25;
                else if (signal === 'NEUTRAL') {
                    signal = 'CALL';
                    strength += 20;
                }
                reason.push('📈 Bullish Cross');
            } else if (ma5 < ma20 && currentPrice < ma5) {
                if (signal === 'PUT') strength += 25;
                else if (signal === 'NEUTRAL') {
                    signal = 'PUT';
                    strength += 20;
                }
                reason.push('📉 Bearish Cross');
            }
            
            if (change > 1) {
                if (signal === 'CALL') strength += 20;
                reason.push('🚀 Strong Up');
            } else if (change > 0.3) {
                if (signal === 'CALL') strength += 10;
                reason.push('Positive');
            } else if (change < -1) {
                if (signal === 'PUT') strength += 20;
                reason.push('⚡ Strong Down');
            } else if (change < -0.3) {
                if (signal === 'PUT') strength += 10;
                reason.push('Negative');
            }
            
            if (data.high && data.low) {
                const range = data.high - data.low;
                if (range > 0) {
                    const positionInRange = (currentPrice - data.low) / range;
                    if (positionInRange < 0.2) {
                        if (signal === 'CALL') strength += 15;
                        reason.push('Near Low');
                    } else if (positionInRange > 0.8) {
                        if (signal === 'PUT') strength += 15;
                        reason.push('Near High');
                    }
                }
            }
            
            if (volatility > 2) {
                strength += 5;
                reason.push('High Vol');
            }
            
            return {
                signal,
                strength: Math.min(strength, 100),
                rsi,
                ma20,
                ma5,
                volatility,
                reason: reason.join(' | ') || 'Analyzing...'
            };
        }

        function estimateOptionPremium(indexName, signal, strikePrice, spotPrice) {
            const basePremiums = {
                NIFTY: { CALL: 120, PUT: 130 },
                BANKNIFTY: { CALL: 250, PUT: 270 },
                SENSEX: { CALL: 350, PUT: 380 }
            };
            
            const base = basePremiums[indexName][signal];
            const moneyness = Math.abs(spotPrice - strikePrice) / spotPrice;
            const adjustment = 1 - (moneyness * 10);
            const premium = base * Math.max(0.3, adjustment);
            const variation = Math.random() * premium * 0.15;
            
            return Math.round(premium + variation);
        }

        function calculateLotSize(indexName, premium) {
            const lotSizes = {
                NIFTY: 50,
                BANKNIFTY: 15,
                SENSEX: 10
            };
            
            const lotSize = lotSizes[indexName];
            const maxLots = Math.floor(CONFIG.maxBudget / (premium * lotSize));
            
            return {
                lots: Math.max(1, maxLots),
                lotSize: lotSize
            };
        }

        function renderIndexCard(indexName, data, marketInfo) {
            const analysis = generateTradingSignal(data, indexName);
            const signalClass = analysis.signal === 'CALL' ? 'signal-buy' : 
                               analysis.signal === 'PUT' ? 'signal-sell' : 'signal-neutral';
            
            const changeClass = data.changePercent >= 0 ? 'positive' : 'negative';
            const changeSymbol = data.changePercent >= 0 ? '▲' : '▼';
            
            let strikeRound = indexName === 'NIFTY' ? 50 : 100;
            const strikePrice = Math.round(data.price / strikeRound) * strikeRound;
            
            const premium = estimateOptionPremium(indexName, analysis.signal, strikePrice, data.price);
            const lotInfo = calculateLotSize(indexName, premium);
            const totalCost = premium * lotInfo.lots * lotInfo.lotSize;
            
            const cardClass = marketInfo.isOpen ? '' : 'market-closed';
            const buttonDisabled = !marketInfo.isOpen ? 'disabled' : '';
            
            return `
                <div class="index-card ${cardClass}">
                    <div class="index-header">
                        <div class="index-name">${indexName}</div>
                        <div class="change ${changeClass}">
                            ${changeSymbol} ${Math.abs(data.changePercent).toFixed(2)}%
                        </div>
                    </div>
                    
                    <div class="price">₹${data.price.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    <div style="color: #666; margin-bottom: 15px;">
                        Change: <span class="${changeClass}" style="font-weight: bold;">
                            ${data.change >= 0 ? '+' : ''}${data.change.toFixed(2)}
                        </span>
                    </div>
                    
                    <div class="market-details">
                        <div class="detail-item">
                            <span class="detail-label">Open</span>
                            <span class="detail-value">₹${data.open.toLocaleString('en-IN', {maximumFractionDigits: 2})}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Prev Close</span>
                            <span class="detail-value">₹${data.previousClose.toLocaleString('en-IN', {maximumFractionDigits: 2})}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Day High</span>
                            <span class="detail-value">₹${data.high.toLocaleString('en-IN', {maximumFractionDigits: 2})}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Day Low</span>
                            <span class="detail-value">₹${data.low.toLocaleString('en-IN', {maximumFractionDigits: 2})}</span>
                        </div>
                    </div>
                    
                    <div class="indicators">
                        <div class="indicator">
                            <div class="indicator-label">RSI (14)</div>
                            <div class="indicator-value" style="color: ${analysis.rsi < 30 ? '#10b981' : analysis.rsi > 70 ? '#ef4444' : '#1e3c72'}">${analysis.rsi}</div>
                        </div>
                        <div class="indicator">
                            <div class="indicator-label">Volatility</div>
                            <div class="indicator-value">${analysis.volatility}%</div>
                        </div>
                        <div class="indicator">
                            <div class="indicator-label">MA (5)</div>
                            <div class="indicator-value">₹${parseFloat(analysis.ma5).toLocaleString('en-IN')}</div>
                        </div>
                        <div class="indicator">
                            <div class="indicator-label">MA (20)</div>
                            <div class="indicator-value">₹${parseFloat(analysis.ma20).toLocaleString('en-IN')}</div>
                        </div>
                    </div>
                    
                    <div style="margin: 15px 0; padding: 12px; background: #f8f9fa; border-radius: 8px; font-size: 0.9em;">
                        <div style="font-weight: bold; color: #333; margin-bottom: 8px;">📊 Analysis:</div>
                        <div style="color: #666; line-height: 1.6;">${analysis.reason}</div>
                    </div>
                    
                    <div class="signal-box ${signalClass}">
                        <div style="font-size: 1.6em; margin-bottom: 10px;">
                            ${analysis.signal === 'CALL' ? '📈 BUY CALL OPTION' : 
                              analysis.signal === 'PUT' ? '📉 BUY PUT OPTION' : '⏸️ WAIT FOR SIGNAL'}
                        </div>
                        <div style="font-size: 1.2em; margin-bottom: 8px;">
                            Signal Strength: <strong>${analysis.strength}%</strong>
                        </div>
                        ${analysis.signal !== 'NEUTRAL' ? `
                            <div style="font-size: 1.1em; margin-top: 10px;">
                                Strike: ₹${strikePrice.toLocaleString('en-IN')} ${analysis.signal}
                            </div>
                        ` : ''}
                    </div>
                    
                    ${analysis.signal !== 'NEUTRAL' ? `
                        <div style="margin: 15px 0; padding: 15px; background: white; border: 2px dashed ${analysis.signal === 'CALL' ? '#10b981' : '#ef4444'}; border-radius: 10px;">
                            <div style="font-weight: bold; margin-bottom: 10px; color: #333;">💰 Trade Details:</div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.95em;">
                                <div><span style="color: #666;">Strike Price:</span></div>
                                <div style="font-weight: bold; text-align: right;">₹${strikePrice.toLocaleString('en-IN')}</div>
                                
                                <div><span style="color: #666;">Premium (Est):</span></div>
                                <div style="font-weight: bold; text-align: right;">₹${premium}</div>
                                
                                <div><span style="color: #666;">Lot Size:</span></div>
                                <div style="font-weight: bold; text-align: right;">${lotInfo.lotSize}</div>
                                
                                <div><span style="color: #666;">Max Lots:</span></div>
                                <div style="font-weight: bold; text-align: right;">${lotInfo.lots}</div>
                                
                                <div style="padding-top: 8px; border-top: 1px solid #e0e0e0;"><span style="color: #666;">Total Cost:</span></div>
                                <div style="padding-top: 8px; border-top: 1px solid #e0e0e0; font-weight: bold; text-align: right; color: ${analysis.signal === 'CALL' ? '#10b981' : '#ef4444'};">₹${totalCost.toLocaleString('en-IN')}</div>
                            </div>
                        </div>
                        
                        <button class="trade-button ${analysis.signal === 'CALL' ? 'btn-call' : 'btn-put'}" 
                                ${buttonDisabled}
                                onclick="openGroww('${indexName}', '${analysis.signal}', ${strikePrice}, ${premium}, ${lotInfo.lots}, ${lotInfo.lotSize}, ${marketInfo.isOpen})">
                            ${marketInfo.isOpen ? '🚀 Execute Trade on Groww' : '🔒 Market Closed'}
                        </button>
                        <div class="premium-info">
                            ${marketInfo.isOpen ? 
                                '⚠️ Premium estimated. Verify on Groww before trading.' :
                                '⏰ Trading available during market hours (9:15 AM - 3:30 PM IST)'
                            }
                        </div>
                    ` : `
                        <div class="premium-info">
                            💡 No strong signal. ${marketInfo.isOpen ? 'Wait for better entry.' : 'Market is closed.'}
                        </div>
                    `}
                    
                    <div class="data-source">
                        ${marketInfo.isOpen ? 
                            '<span class="live-indicator"></span> Real-time live data' :
                            '<span class="paused-indicator"></span> Market closed - Last available data'
                        }
                    </div>
                </div>
            `;
        }

        function openGroww(indexName, signal, strikePrice, premium, lots, lotSize, isOpen) {
            if (!isOpen) {
                alert('⚠️ Market is currently closed!\n\nTrading hours: 9:15 AM - 3:30 PM IST (Monday - Friday)\n\nPlease try again during market hours.');
                return;
            }
            
            const totalCost = premium * lots * lotSize;
            
            alert(`🎯 TRADE DETAILS

📊 Index: ${indexName}
${signal === 'CALL' ? '📈' : '📉'} Signal: BUY ${signal}
💵 Strike: ₹${strikePrice.toLocaleString('en-IN')}
💰 Premium: ₹${premium}
📦 Lot Size: ${lotSize}
🔢 Lots: ${lots}
💳 Total: ₹${totalCost.toLocaleString('en-IN')}

Opening Groww...`);
            
            window.open('https://groww.in/stocks/stock-futures-options', '_blank');
        }

        function updateClock() {
            const istTime = getISTTime();
            document.getElementById('currentTime').textContent = 
                istTime.toLocaleTimeString('en-IN', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: false 
                });
        }

        async function updateDashboard() {
            const marketInfo = checkMarketHours();
            isMarketOpen = marketInfo.isOpen;
            
            // Update market status
            const marketStatus = document.getElementById('marketStatus');
            if (marketInfo.isOpen) {
                marketStatus.innerHTML = '🟢 OPEN';
                marketStatus.style.color = '#10b981';
                document.getElementById('headerStatus').innerHTML = 
                    '<span class="live-indicator"></span>Live Market Data - Trading Active';
            } else {
                marketStatus.innerHTML = '🔴 CLOSED';
                marketStatus.style.color = '#ef4444';
                document.getElementById('headerStatus').innerHTML = 
                    '<span class="paused-indicator"></span>Market Closed';
            }
            
            displayMarketClosedNotice(marketInfo);
            
            const autoRefresh = document.getElementById('autoRefresh');
            if (marketInfo.isOpen) {
                autoRefresh.innerHTML = '🔄 30s';
                autoRefresh.classList.add('blink');
            } else {
                autoRefresh.innerHTML = '⏸️ Paused';
                autoRefresh.classList.remove('blink');
            }

            // Fetch real market data
            const marketData = await fetchRealMarketData();
            
            if (!marketData) {
                document.getElementById('mainContent').innerHTML = `
                    <div class="loading">
                        <p style="color: #ef4444;">⚠️ Unable to fetch live market data</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">
                            This could be due to:<br>
                            • CORS restrictions<br>
                            • API rate limits<br>
                            • Network issues<br><br>
                            Retrying in 30 seconds...
                        </p>
                    </div>
                `;
                return;
            }

            const mainContent = document.getElementById('mainContent');
            let html = '';
            let totalStrength = 0;
            let signalCount = 0;
            
            ['NIFTY', 'BANKNIFTY', 'SENSEX'].forEach(indexName => {
                if (marketData[indexName]) {
                    // Store in historical data
                    historicalData[indexName].push(marketData[indexName].price);
                    if (historicalData[indexName].length > 100) {
                        historicalData[indexName].shift();
                    }
                    
                    html += renderIndexCard(indexName, marketData[indexName], marketInfo);
                    const analysis = generateTradingSignal(marketData[indexName], indexName);
                    totalStrength += analysis.strength;
                    signalCount++;
                }
            });
            
            mainContent.innerHTML = html;
            
            const avgStrength = signalCount > 0 ? (totalStrength / signalCount).toFixed(0) : 0;
            document.getElementById('signalStrength').textContent = `${avgStrength}%`;
            
            const now = getISTTime();
            document.getElementById('lastUpdate').innerHTML = `
                ${marketInfo.isOpen ? 
                    '<span class="live-indicator"></span>' :
                    '<span class="paused-indicator"></span>'
                }
                ${marketInfo.isOpen ? 'Updated' : 'Last updated'}: ${now.toLocaleTimeString('en-IN', { 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit',
                    hour12: true 
                })} IST
            `;
        }

        // Initialize
        updateDashboard();
        updateClock();
        
        setInterval(updateClock, 1000);
        
        function smartRefresh() {
            const marketInfo = checkMarketHours();
            
            if (marketInfo.isOpen) {
                if (refreshTimer) clearInterval(refreshTimer);
                refreshTimer = setInterval(updateDashboard, CONFIG.refreshInterval);
                updateDashboard();
            } else {
                if (refreshTimer) {
                    clearInterval(refreshTimer);
                    refreshTimer = null;
                }
                updateDashboard();
            }
        }
        
        smartRefresh();
        setInterval(smartRefresh, 60000);
        
        window.addEventListener('beforeunload', () => {
            if (refreshTimer) clearInterval(refreshTimer);
        });
    </script>
</body>
</html>
